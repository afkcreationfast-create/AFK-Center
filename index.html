<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFK Création et Marketing - Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 600px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .chat-header {
            background: #0f172a;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
        }
        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.bot {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.user {
            background: #0284c7;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-footer {
            padding: 12px;
            background: #0f172a;
            display: flex;
            gap: 8px;
            border-top: 1px solid #334155;
        }
        .chat-footer input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }
        .chat-footer input:focus {
            border-color: #38bdf8;
        }
        .chat-footer button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-footer button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">AFK Création et Marketing 🚀</div>
        <div class="chat-body" id="chatBody">
            <div class="message bot">Bonjour ! Bienvenue chez AFK Création et Marketing. Comment puis-je vous aider ?</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Écrivez votre message..." onkeydown="checkEnter(event)">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        // Variables d'état pour la sécurité du créateur
        let isCreatorAuthenticated = false;
        let waitingForPassword = false;

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text === '') return;

            const chatBody = document.getElementById('chatBody');

            // Afficher le message de l'utilisateur
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatBody.appendChild(userMsg);
            input.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;

            const lowerText = text.toLowerCase();

            // Étape 1 : Si on attend le mot de passe après une revendication de boss/créateur
            if (waitingForPassword) {
                waitingForPassword = false;
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';

                if (text === "afk2026") {
                    isCreatorAuthenticated = true;
                    botMsg.innerHTML = "Accès validé ! Salut Fransen, le créateur 🚀 Tu es connecté en mode admin.";
                } else {
                    isCreatorAuthenticated = false;
                    botMsg.innerHTML = "Mot de passe incorrect. Tu restes considéré comme un visiteur/client de l'AFK Center.";
                }
                chatBody.appendChild(botMsg);
                chatBody.scrollTop = chatBody.scrollHeight;
                return;
            }

            // Étape 2 : Détecter si quelqu'un prétend être le boss ou le créateur
            if ((lowerText.includes("créateur") || lowerText.includes("createur") || lowerText.includes("boss") || lowerText.includes("c'est moi")) && !isCreatorAuthenticated) {
                waitingForPassword = true;
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.innerHTML = "Quel est le mot de passe secret ?";
                chatBody.appendChild(botMsg);
                chatBody.scrollTop = chatBody.scrollHeight;
                return;
            }

            // Étape 3 : Traitement normal (Visiteur par défaut ou Créateur authentifié)
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message bot';
            loadingMsg.textContent = "...";
            chatBody.appendChild(loadingMsg);
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                let finalMessage = text;
                if (isCreatorAuthenticated) {
                    finalMessage = "[CRÉATEUR FRANSEN] " + text;
                } else {
                    finalMessage = "[CLIENT / VISITEUR] " + text;
                }

                const response = await fetch('/api/chat', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: finalMessage })
                });

                const data = await response.json();
                chatBody.removeChild(loadingMsg);

                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';

                if (response.ok && data.choices && data.choices.length > 0) {
                    botMsg.innerHTML = data.choices[0].message.content;
                } else {
                    botMsg.innerHTML = "Contacte-nous sur WhatsApp : +509 38 89 85 21";
                }

                chatBody.appendChild(botMsg);
                chatBody.scrollTop = chatBody.scrollHeight;

            } catch (error) {
                chatBody.removeChild(loadingMsg);
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message bot';
                errorMsg.innerHTML = "Erreur de connexion. WhatsApp : +509 38 89 85 21";
                chatBody.appendChild(errorMsg);
                chatBody.scrollTop = chatBody.scrollHeight;
            }
        }
    </script>
</body>
</html>
